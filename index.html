<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- B20: the original pinned maximum-scale=1.0, user-scalable=no, which
       blocks pinch zoom for anyone who needs to magnify the UI. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Load a 3D model from your device, a URL or a Google Drive link, inspect it, light it and view it in AR.">
  <meta name="color-scheme" content="dark light">
  <title>3D Model Viewer</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>

<body>
  <!-- The renderer's canvas is created by the viewer and appended here. -->
  <main id="viewport" aria-label="3D viewport"></main>

  <div id="loading" class="loading" hidden role="status" aria-live="polite">
    <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
    <p class="loading-label" id="loadingLabel">Loading…</p>
  </div>

  <div id="toasts" class="toasts" role="log" aria-live="polite" aria-relevant="additions"></div>

  <aside id="panel" class="panel" aria-label="Viewer controls">
    <header class="panel-head">
      <h1 class="panel-title">3D Model Viewer</h1>
      <button type="button" id="panelToggle" class="icon-button" aria-expanded="true"
              aria-controls="panelBody" title="Collapse panel">−</button>
    </header>

    <div class="panel-body" id="panelBody">
      <section class="group">
        <h2 class="group-title">Load</h2>
        <button type="button" id="openFile" class="button">Choose file…</button>
        <p class="hint">…or drop a file anywhere on the page.</p>
        <input type="file" id="fileInput" class="visually-hidden"
               accept=".glb,.gltf,.fbx,.obj,.mtl,.stl,.usdz,.usda,.usdc,.usd,.bin,image/*" multiple>

        <form id="urlForm" class="url-form">
          <label for="urlInput" class="url-label">From a link</label>
          <div class="url-field">
            <input type="url" id="urlInput" placeholder="Google Drive share link or direct URL"
                   autocomplete="off" spellcheck="false">
            <button type="submit" id="urlSubmit" class="button">Load</button>
          </div>
          <p class="hint" id="urlHint">
            Google Drive, Dropbox, GitHub or any direct link.
          </p>
        </form>

        <button type="button" id="loadDemo" class="button button-quiet">Load demo model</button>
      </section>

      <section class="group">
        <h2 class="group-title">Model</h2>
        <div class="row">
          <label for="scaleSlider">Scale</label>
          <input type="range" id="scaleSlider" min="0.1" max="3" step="0.05" value="1">
          <output for="scaleSlider" id="scaleOut">1.00×</output>
        </div>
        <div class="row">
          <label for="heightSlider">Height</label>
          <input type="range" id="heightSlider" min="-15" max="15" step="0.1" value="0">
          <output for="heightSlider" id="heightOut">0.0</output>
        </div>
        <div class="row row-buttons">
          <button type="button" id="frameButton" class="button button-quiet">Frame</button>
          <button type="button" id="resetButton" class="button button-quiet">Reset cam</button>
        </div>
        <div class="row row-check">
          <input type="checkbox" id="autoRotate">
          <label for="autoRotate">Auto-rotate</label>
        </div>
        <div class="row row-check">
          <input type="checkbox" id="stageToggle" checked>
          <label for="stageToggle">Show stage</label>
        </div>
        <div class="row row-check">
          <input type="checkbox" id="wireframe">
          <label for="wireframe">Wireframe</label>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title">Lighting</h2>
        <div class="row">
          <label for="ambientSlider">Ambient</label>
          <input type="range" id="ambientSlider" min="0" max="3" step="0.05" value="0.3">
          <output for="ambientSlider" id="ambientOut">0.30</output>
        </div>
        <div class="row">
          <label for="sunSlider">Sun</label>
          <input type="range" id="sunSlider" min="0" max="5" step="0.05" value="1.8">
          <output for="sunSlider" id="sunOut">1.80</output>
        </div>
        <div class="row">
          <label for="leftSlider">Left fill</label>
          <input type="range" id="leftSlider" min="0" max="30" step="0.1" value="4.5">
          <output for="leftSlider" id="leftOut">4.5</output>
        </div>
        <div class="row">
          <label for="rightSlider">Right fill</label>
          <input type="range" id="rightSlider" min="0" max="30" step="0.1" value="2.1">
          <output for="rightSlider" id="rightOut">2.1</output>
        </div>
        <div class="row">
          <label for="angleSlider">Sun angle</label>
          <input type="range" id="angleSlider" min="-90" max="270" step="1" value="53">
          <output for="angleSlider" id="angleOut">53°</output>
        </div>
        <div class="row row-check">
          <input type="checkbox" id="shadowToggle" checked>
          <label for="shadowToggle">Shadows</label>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title">Environment</h2>
        <div class="row">
          <label for="exposureSlider">Exposure</label>
          <input type="range" id="exposureSlider" min="0" max="3" step="0.05" value="0.6">
          <output for="exposureSlider" id="exposureOut">0.60</output>
        </div>
        <div class="row">
          <label for="envIntensity">Env intensity</label>
          <input type="range" id="envIntensity" min="0" max="3" step="0.05" value="1">
          <output for="envIntensity" id="envIntensityOut">1.00</output>
        </div>
        <div class="row">
          <label for="envRotation">Env rotation</label>
          <input type="range" id="envRotation" min="0" max="360" step="1" value="0">
          <output for="envRotation" id="envRotationOut">0°</output>
        </div>
        <div class="row">
          <label for="toneMapping">Tone mapping</label>
          <select id="toneMapping">
            <option value="agx" selected>AgX</option>
            <option value="neutral">Neutral</option>
            <option value="aces">ACES Filmic</option>
            <option value="reinhard">Reinhard</option>
            <option value="cineon">Cineon</option>
            <option value="linear">Linear</option>
            <option value="none">None</option>
          </select>
        </div>
        <div class="row row-check">
          <input type="checkbox" id="bgToggle" checked>
          <label for="bgToggle">Show background</label>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title">Capture</h2>
        <div class="row row-buttons">
          <button type="button" id="screenshotButton" class="button">Screenshot</button>
        </div>
        <div class="row row-check">
          <input type="checkbox" id="shotTransparent">
          <label for="shotTransparent">Transparent background</label>
        </div>
        <div class="row">
          <label for="shotScale">Resolution</label>
          <input type="range" id="shotScale" min="1" max="4" step="1" value="1">
          <output for="shotScale" id="shotScaleOut">1×</output>
        </div>
      </section>

      <section class="group">
        <h2 class="group-title">Stats</h2>
        <dl class="stats" id="stats">
          <dt>FPS</dt><dd id="statFps">—</dd>
          <dt>Triangles</dt><dd id="statTris">—</dd>
          <dt>Draw calls</dt><dd id="statCalls">—</dd>
          <dt>Textures</dt><dd id="statTextures">—</dd>
        </dl>
      </section>
    </div>
  </aside>

  <div id="dropOverlay" class="drop-overlay" hidden aria-hidden="true">
    <p>Drop to load</p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
